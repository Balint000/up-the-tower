name: Godot Tests Runner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Ez a konténer tartalmazza a Godot engine-t és a Linux függőségeket
    container:
      image: barichello/godot-ci:4.6

    steps:
      # 1. Forráskód letöltése
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Asset importálás – a Godot generálja a .godot/ cache könyvtárat.
      #    A || true azért kell, mert headless módban az editor nem-nulla
      #    kilépési kóddal zárhat, ami egyébként megbuktatná a lépést.
      - name: Import assets
        run: godot --headless --verbose --editor --quit || true

      # 3. GUT unit tesztek futtatása
      #    -gexit      : kilép a tesztek befejezése után
      #    -gdir       : a tesztfájlok könyvtára
      #    -glog_level : 1 = figyelmeztetések és hibák logolva
      - name: Run GUT tests
        run: |
          godot --headless \
            --script addons/gut/gut_cmdln.gd \
            -gexit \
            -gdir=res://tests/unit \
            -glog_level=1

      # 4. Teszt eredmény feltöltése – csak akkor fut, ha valamelyik
      #    korábbi lépés sikertelen volt (hibakereséshez hasznos)
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gut-logs
          path: |
            .godot/
            *.log
          retention-days: 5
