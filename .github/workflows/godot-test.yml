name: 🧪 Godot CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: up-the-tower

jobs:
  # ===== UNIT TESTS =====
  unit-tests:
    name: 🔬 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: 🔍 Verify Godot Installation
        run: godot --version

      - name: 📦 Import Project Assets
        run: |
          godot --headless --editor --quit-after 100 || true
        timeout-minutes: 3
        continue-on-error: true

      - name: 🧪 Run Unit Tests
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd \
            -gexit \
            -gdir=res://tests/unit \
            -ginclude_subdirs \
            -gpretty \
            -gverbose
        continue-on-error: false

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            .gut_editor.xml
            .gut_editor_config.json

  # ===== INTEGRATION TESTS =====
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: 📦 Import Project
        run: |
          godot --headless --editor --quit-after 100 || true
        timeout-minutes: 3
        continue-on-error: true

      - name: 🧪 Run Integration Tests
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd \
            -gexit \
            -gdir=res://tests/integration \
            -ginclude_subdirs \
            -gpretty \
            -gverbose
        continue-on-error: true

      - name: 📊 Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: .gut_editor.xml

  # ===== STATIC ANALYSIS =====
  static-analysis:
    name: 🔍 Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install gdtoolkit
        run: |
          pip install gdtoolkit==4.*

      - name: 🔍 Run GDScript Linter
        run: |
          gdlint scripts/ tests/
        continue-on-error: true

      - name: 🎨 Check Code Formatting
        run: |
          gdformat --check scripts/ tests/
        continue-on-error: true

  # ===== BUILD VERIFICATION =====
  build-test:
    name: 🏗️ Build Test (Linux)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: 🎮 Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: 📦 Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          godot --headless --editor --quit-after 100 || true

      - name: 🏗️ Test Build (No Export)
        run: |
          godot --headless --editor --quit-after 100
        timeout-minutes: 5
        continue-on-error: true

  # ===== CODE METRICS =====
  code-metrics:
    name: 📈 Code Metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Calculate Code Statistics
        run: |
          echo "### 📊 Code Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**GDScript Files:**" >> $GITHUB_STEP_SUMMARY
          GDSCRIPT_COUNT=$(find scripts tests -name "*.gd" 2>/dev/null | wc -l)
          echo "- Total: $GDSCRIPT_COUNT files" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Lines of Code:**" >> $GITHUB_STEP_SUMMARY
          TOTAL_LINES=$(find scripts tests -name "*.gd" -exec cat {} \; 2>/dev/null | wc -l)
          echo "- Total: $TOTAL_LINES lines" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Coverage:**" >> $GITHUB_STEP_SUMMARY
          TEST_FILES=$(find tests -name "test_*.gd" 2>/dev/null | wc -l)
          echo "- Test Files: $TEST_FILES" >> $GITHUB_STEP_SUMMARY

      - name: 🎯 Test Summary
        run: |
          echo "✅ Tests configured and ready to run!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run locally with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "godot --headless --script addons/gut/gut_cmdln.gd -gexit -gdir=res://tests/unit" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===== SUMMARY =====
  test-summary:
    name: ✅ Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, static-analysis]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "### 🎮 Up The Tower - Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
