name: Godot Tests Runner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # This container image includes Godot and required Linux dependencies
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Godot Import
        run: godot --headless --verbose --editor --quit

      - name: Run GUT Tests
        # --headless: run without window
        # --script addons/gut/gut_cmdln.gd: GUT CLI runner
        # -gexit: exit after tests finish
        # -gdir: tests directory
        run: |
          godot --headless --script addons/gut/gut_cmdln.gd -gexit -gdir=res://tests/unit
