name: 🧪 Godot Tests

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🧪 Run GUT Tests
        run: |
          godot --version
          godot --headless --script addons/gut/gut_cmdln.gd -gexit -gdir=res://tests/unit -gpretty || true
        continue-on-error: true

      - name: ✅ Complete
        run: echo "Tests completed!"
